  <path fill="currentColor" d="M0 0 H400 V6 c-6 0 -6 10 -12 10 s-4 -10 -10 -10 c-4 0 -4 22 -9 22 s-5 -22 -9 -22 h-30 c-5 0 -5 14 -10 14 s-5 -14 -10 -14 h-40 c-4 0 -4 30 -9 30 s-5 -30 -9 -30 h-26 c-5 0 -5 9 -10 9 s-5 -9 -10 -9 h-44 c-5 0 -5 20 -10 20 s-5 -20 -10 -20 h-24 c-4 0 -4 12 -8 12 s-4 -12 -8 -12 h-40 c-5 0 -5 26 -10 26 s-5 -26 -10 -26 h-30 c-5 0 -5 10 -10 10 s-5 -10 -10 -10 h-22 Z"/>
</symbol>
</svg>
